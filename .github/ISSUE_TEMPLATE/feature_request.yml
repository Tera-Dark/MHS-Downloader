name: 功能建议
description: 提出体验、适配或维护改进
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体问题
      description: 描述现在的操作成本，不必先确定技术方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 权限或隐私影响（如已知）
      description: 不接受验证码破解、代理轮换、账号轮换或隐蔽绕过站点权限的提案。

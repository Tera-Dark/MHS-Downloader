name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run format:check
      - run: python -m unittest discover -s tests/packaging
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: unpacked-extension-release
          path: |
            artifacts/ArtworkArchive-*.zip
            artifacts/ArtworkArchive-*.zip.sha256

  browser-regression:
    # Opt-in because Chromium setup is heavier. Uses local fixtures, never a real account.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-browser-regression
          path: artifacts/browser-tests/
